<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="converter">
        <div class="container">
            <header class="converter-header">
                <h1 class="converter-title">Unit Converter</h1>
            </header>

            <div class="converter-nav">
                <a href="{{ url_for('length') }}" class="converter-btn">Length</a>
                <a href="{{ url_for('weight') }}" class="converter-btn">Weight</a>
                <a href="{{ url_for('temperature') }}" class="converter-btn">Temperature</a>
            </div>

            <div class="result-card">
                <div class="result-header">
                    <span class="result-title">
                        Result of your calculation
                    </span>
                </div>

                <div class="result-value">
                    <span>{%block result%}{%endblock%}</span>
                </div>
            </div>

            <form action="{{ url_for(back_page) }}" method="GET">
                <button type="submit" class="convert-btn">
                    Reset
                </button>
            </form>
        </div>


    </div>

</body>

</html>
